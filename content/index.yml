seo:
  title: Skema - Le CMS headless connecte a votre base de donnees
  description: Skema transforme votre base de donnees en un espace de gestion simple et intuitif. Vos donnees restent chez vous. Toujours.
title: "Gerez votre contenu.\nGardez vos donnees."
description: Skema transforme votre base de donnees en un espace de gestion simple et intuitif. Vos informations restent chez vous. Toujours.
hero:
  headline: "v1.2 - Integration IA avec MCP"
  links:
    - label: Demarrer gratuitement
      color: primary
      size: xl
      to: '#'
    - label: Voir la demo
      size: xl
      color: neutral
      variant: soft
      to: '#'
terminal:
  lines:
    - segments:
        - text: "$ "
          style: prompt
        - text: "npx skema"
          style: cmd
        - text: " connect"
          style: flag
    - segments:
        - text: "→ Connexion a votre base de donnees..."
          style: dim
    - segments:
        - text: "→ Trouve "
          style: dim
        - text: "12 tables"
          style: cmd
        - text: ", "
          style: dim
        - text: "847 enregistrements"
          style: cmd
        - text: ", "
          style: dim
        - text: "8 relations"
          style: cmd
    - segments:
        - text: "→ Generation de l'interface "
          style: dim
        - text: "✓"
          style: success
    - segments:
        - text: "→ Dashboard pret en "
          style: dim
        - text: "2 min"
          style: metric-good
    - segments:
        - text: " "
          style: dim
    - segments:
        - text: "✓ En ligne sur "
          style: success
        - text: "https://app.skema.io/mon-projet"
          style: url
logos:
  title: Compatible avec vos outils existants
  items:
    - i-simple-icons-postgresql
    - i-simple-icons-mysql
    - i-simple-icons-supabase
    - i-simple-icons-mongodb
    - i-simple-icons-firebase
features:
  headline: Fonctionnalites
  title: "Tout ce qu'il vous faut."
  description: Une solution complete pour gerer vos contenus sans jamais perdre le controle de vos donnees.
  items:
    - icon: i-lucide-database
      title: Vos donnees chez vous
      description: Skema se connecte a votre base existante. Vos informations ne bougent pas, ne sont jamais copiees.
    - icon: i-lucide-share-2
      title: API REST automatique
      description: Skema cree automatiquement une API securisee pour que vos applications puissent lire et modifier vos donnees.
    - icon: i-lucide-layout-dashboard
      title: Un seul tableau de bord
      description: Vous avez 20 clients ? Gerez tout depuis un seul endroit. Plus besoin de jongler entre plusieurs outils.
    - icon: i-lucide-shield-check
      title: Securite bancaire
      description: Vos acces sont proteges par un chiffrement ultra-securise. Personne ne peut voir vos informations.
    - icon: i-lucide-users
      title: Simple pour tous
      description: Concu pour que meme quelqu'un qui n'est pas technique puisse gerer son contenu facilement.
    - icon: i-lucide-bot
      title: Integration IA native
      description: Connectez Claude ou ChatGPT directement a vos donnees grace au protocole MCP.
metrics:
  headline: En chiffres
  title: "La confiance de centaines d'equipes."
  description: Des freelances aux grandes organisations, Skema simplifie la gestion de contenu tout en garantissant la securite.
  items:
    - value: "99.9%"
      label: Disponibilite
      class: "text-success"
    - value: "2-3j"
      label: Gagnes par projet
      class: "text-primary"
    - value: "500+"
      label: Utilisateurs actifs
      class: "text-info"
    - value: "98%"
      label: Satisfaction
      class: "text-warning"
cta:
  title: "Pret a simplifier\nvotre gestion ?"
  description: Gratuit pour demarrer. Sans engagement. Pret en 2 minutes.
  command: npx skema init
  links:
    - label: Commencer maintenant
      color: primary
      to: '#'
